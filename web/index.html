<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Robocode Blocks</title>

  <!-- いまは確認用にネットから Blockly を読み込む（あとで web フォルダに同梱する） -->
  <script src="https://unpkg.com/blockly/blockly.min.js"></script>
  <script src="https://unpkg.com/blockly/msg/ja.js"></script>

  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      font-family: "Meiryo", sans-serif;
      font-size: 14px;
    }

    /* 上のバー（ロボット名とボタン） */
    #toolbar {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 48px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      background: #2c3e50;
      color: #fff;
      box-sizing: border-box;
    }
    #toolbar input {
      font-size: 14px;
      padding: 4px 8px;
      width: 180px;
    }
    #toolbar button {
      font-size: 14px;
      padding: 6px 16px;
      border: none;
      border-radius: 4px;
      background: #27ae60;
      color: #fff;
      cursor: pointer;
    }
    #toolbar button:hover { background: #2ecc71; }

    /* 左：ブロックを組む場所 */
    #blocklyDiv {
      position: absolute;
      top: 48px; left: 0; bottom: 0;
      right: 400px;
    }

    /* 右：結果を表示する場所 */
    #resultPanel {
      position: absolute;
      top: 48px; right: 0; bottom: 0;
      width: 400px;
      display: flex;
      flex-direction: column;
      border-left: 1px solid #ccc;
      background: #fafafa;
    }
    #status {
      padding: 8px 12px;
      font-weight: bold;
      border-bottom: 1px solid #ddd;
    }
    #status.ok    { background: #e8f8ee; color: #1e7e34; }
    #status.error { background: #fdecea; color: #b02a1f; }
    #messages {
      max-height: 40%;
      overflow-y: auto;
      border-bottom: 1px solid #ddd;
    }
    .message {
      padding: 6px 12px;
      border-bottom: 1px solid #eee;
    }
    .message.error   { color: #b02a1f; }
    .message.warning { color: #8a6d00; }
    .message.clickable { cursor: pointer; }
    .message.clickable:hover { background: #eef3fb; }
    #javaHeader {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 12px;
      color: #555;
    }
    #javaHeader button { font-size: 12px; }
    #javaCode {
      flex: 1;
      margin: 0;
      padding: 8px 12px;
      overflow: auto;
      background: #1e1e1e;
      color: #d4d4d4;
      font-family: Consolas, monospace;
      font-size: 13px;
      white-space: pre;
    }
  </style>
</head>
<body>
  <div id="toolbar">
    <label for="robotName">ロボットの名前</label>
    <input id="robotName" value="MyRobot" maxlength="40">
    <button id="convertButton">Java を作る</button>
  </div>

  <div id="blocklyDiv"></div>

  <div id="resultPanel">
    <div id="status">ブロックを組んで「Java を作る」を押してください</div>
    <div id="messages"></div>
    <div id="javaHeader">
      <span>できた Java</span>
      <button id="copyButton">コピー</button>
    </div>
    <pre id="javaCode"></pre>
  </div>

  <script>
    // ブロックは C++（ROBOCODE_BLOCKS で書いたもの）から届くので、ここでは書かない。
    const workspace = Blockly.inject('blocklyDiv', {
      toolbox: { kind: 'categoryToolbox', contents: [] },
      trashcan: true,
      zoom: { controls: true, wheel: true }
    });

    // ------------------------------------------------------------
    // 「Java を作る」ボタン：ブロックのデータを C++ に送る
    //   送る形：{ kind: "convert", name: "MyRobot", workspace: {...} }
    // ------------------------------------------------------------
    document.getElementById('convertButton').addEventListener('click', () => {
      const name = document.getElementById('robotName').value.trim();

      // Java のクラス名に使えるか確かめる（英字で始まり、英数字と _ だけ）
      if (!/^[A-Za-z][A-Za-z0-9_]*$/.test(name)) {
        showStatus('error', 'ロボットの名前は、英字で始めて、英字・数字・_ だけで書いてください');
        return;
      }

      window.chrome.webview.postMessage({
        kind: 'convert',
        name: name,
        workspace: Blockly.serialization.workspaces.save(workspace)
      });
    });

    // できた Java をコピーする
    document.getElementById('copyButton').addEventListener('click', () => {
      const text = document.getElementById('javaCode').textContent;
      if (text) navigator.clipboard.writeText(text);
    });

    // ------------------------------------------------------------
    // C++ からのメッセージを受け取る
    // ------------------------------------------------------------
    window.chrome.webview.addEventListener('message', (event) => {
      const msg = event.data;

      // ブロックの定義とツールボックス
      if (msg.kind === 'blocks') {
        Blockly.defineBlocksWithJsonArray(msg.setup.blocks);
        workspace.updateToolbox(msg.setup.toolbox);

        // ブロックの書き方にミスがあったら知らせる（作っている人向け）
        const problems = msg.setup.problems || [];
        if (problems.length > 0) {
          alert('ブロックの設定ミスがあります\n\n' + problems.join('\n'));
        }
      }

      // Java に変換した結果
      if (msg.kind === 'java') {
        document.getElementById('javaCode').textContent = msg.java;
        showMessages(msg.errors, msg.warnings);
        if (msg.ok) {
          showStatus('ok', msg.warnings.length > 0
            ? 'Java ができました（注意が ' + msg.warnings.length + ' 件あります）'
            : 'Java ができました');
        } else {
          showStatus('error', 'エラーが ' + msg.errors.length + ' 件あります。直してからもう一度押してください');
        }
      }
    });

    // 上の帯に結果を表示する
    function showStatus(type, text) {
      const status = document.getElementById('status');
      status.className = type;
      status.textContent = text;
    }

    // エラー・注意の一覧を表示する（クリックするとそのブロックに移動する）
    function showMessages(errors, warnings) {
      const box = document.getElementById('messages');
      box.innerHTML = '';
      const add = (type, mark, m) => {
        const div = document.createElement('div');
        div.className = 'message ' + type;
        div.textContent = mark + ' ' + (m.label ? '【' + m.label + '】' : '') + m.text;
        if (m.blockId && workspace.getBlockById(m.blockId)) {
          div.classList.add('clickable');
          div.title = 'クリックするとブロックに移動します';
          div.addEventListener('click', () => {
            workspace.centerOnBlock(m.blockId);
            workspace.getBlockById(m.blockId).select();
          });
        }
        box.appendChild(div);
      };
      errors.forEach(m => add('error', '✖', m));
      warnings.forEach(m => add('warning', '⚠', m));
    }
  </script>
</body>
</html>
