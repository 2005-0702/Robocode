<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Robocode Blocks</title>

  <!-- いまは確認用にネットから Blockly を読み込む（あとで web フォルダに同梱する）
       バージョンを固定しておく（固定しないと、Blockly が更新されたときに急に動かなくなることがある） -->
  <script src="https://unpkg.com/blockly@11.2.1/blockly.min.js"></script>
  <script src="https://unpkg.com/blockly@11.2.1/msg/ja.js"></script>

  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      font-family: "Meiryo", sans-serif;
      font-size: 14px;
    }

    /* 上のバー（ロボット名とボタン） */
    #toolbar {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 48px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      background: #2c3e50;
      color: #fff;
      box-sizing: border-box;
    }
    #toolbar input {
      font-size: 14px;
      padding: 4px 8px;
      width: 150px;
    }
    #toolbar input#packageName { width: 110px; }
    #toolbar input.invalid { outline: 2px solid #e74c3c; }
    #toolbar .sep {
      width: 1px;
      height: 28px;
      background: #4b6278;
      margin: 0 4px;
    }
    #toolbar .dot { font-weight: bold; }
    #fileName {
      font-size: 12px;
      color: #c8d3de;
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #toolbar button {
      font-size: 14px;
      padding: 6px 16px;
      border: none;
      border-radius: 4px;
      background: #27ae60;
      color: #fff;
      cursor: pointer;
    }
    #toolbar button:hover { background: #2ecc71; }
    #toolbar button.sub { background: #5d6d7e; }
    #toolbar button.sub:hover { background: #7f8c8d; }
    #toolbar button:disabled { background: #95a5a6; cursor: wait; }

    /* 左：ブロックを組む場所 */
    #blocklyDiv {
      position: absolute;
      top: 48px; left: 0; bottom: 0;
      right: 400px;
    }

    /* 右：結果を表示する場所 */
    #resultPanel {
      position: absolute;
      top: 48px; right: 0; bottom: 0;
      width: 400px;
      display: flex;
      flex-direction: column;
      border-left: 1px solid #ccc;
      background: #fafafa;
    }
    #status {
      padding: 8px 12px;
      font-weight: bold;
      border-bottom: 1px solid #ddd;
    }
    #status.ok    { background: #e8f8ee; color: #1e7e34; }
    #status.error { background: #fdecea; color: #b02a1f; }
    #messages {
      max-height: 40%;
      overflow-y: auto;
      border-bottom: 1px solid #ddd;
    }
    .message {
      padding: 6px 12px;
      border-bottom: 1px solid #eee;
    }
    .message.error   { color: #b02a1f; }
    .message.warning { color: #8a6d00; }
    .message.info    { color: #1e7e34; }
    .message.detail  {
      color: #333;
      font-family: Consolas, monospace;
      font-size: 12px;
      white-space: pre-wrap;
      background: #fff;
    }
    .message.clickable { cursor: pointer; }
    .message.clickable:hover { background: #eef3fb; }
    #javaHeader {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 12px;
      color: #555;
    }
    #javaHeader button { font-size: 12px; }
    #javaCode {
      flex: 1;
      margin: 0;
      padding: 8px 12px;
      overflow: auto;
      background: #1e1e1e;
      color: #d4d4d4;
      font-family: Consolas, monospace;
      font-size: 13px;
      white-space: pre;
    }

    /* ブロックの検索 */
    #searchBox {
      width: 140px !important;
      border-radius: 12px;
      border: none;
    }

    /* 囲んで選ぶときの四角 */
    #selectBand {
      position: fixed;
      border: 2px dashed #2980b9;
      background: rgba(41, 128, 185, 0.12);
      pointer-events: none;
      z-index: 50;
    }
  </style>
</head>
<body>
  <div id="toolbar">
    <!-- 作品のファイル -->
    <button id="newButton" class="sub" title="新しく作る">新規</button>
    <button id="openButton" class="sub" title="保存した作品を開く">開く</button>
    <button id="saveButton" class="sub" title="作品を保存（Ctrl+S）">保存</button>
    <button id="saveAsButton" class="sub" title="別の名前で保存">別名で保存</button>
    <span id="fileName">（まだ保存していません）</span>

    <span class="sep"></span>

    <!-- ブロックを名前で探す -->
    <input id="searchBox" type="search" placeholder="🔍 ブロックを検索"
           title="ブロックの名前の一部を入れると、当てはまるブロックが出てきます（Esc で閉じる）">

    <span class="sep"></span>

    <!-- パッケージ名とロボットの名前 → Robocode では「パッケージ名.ロボットの名前」で表示される -->
    <label for="packageName">パッケージ</label>
    <input id="packageName" value="student" maxlength="16"
           title="小文字の英字で始まり、小文字・数字・_ だけ（. で区切れる）。16文字まで">
    <span class="dot">.</span>
    <label for="robotName">ロボットの名前</label>
    <input id="robotName" value="MyRobot" maxlength="32"
           title="英字で始まり、英字・数字・_ だけ。32文字まで">
    <button id="convertButton">Java を作る</button>

    <span style="flex: 1"></span>
    <button id="launchButton" title="Robocode を起動する（このアプリから開いた Robocode なら開き直す）">Robocode を開く</button>
    <button id="folderButton" class="sub">Robocode の場所</button>
  </div>

  <div id="blocklyDiv"></div>

  <div id="resultPanel">
    <div id="status">ブロックを組んで「Java を作る」を押してください（Shift + ドラッグで囲んで Delete でまとめて消す／Ctrl + D で複製）</div>
    <div id="messages"></div>
    <div id="javaHeader">
      <span>できた Java</span>
      <button id="copyButton">コピー</button>
    </div>
    <pre id="javaCode"></pre>
  </div>

  <script>
    // ------------------------------------------------------------
    // 見た目のテーマ（色や文字の大きさ）
    //   ブロック1つ1つの色は C++ の kCategories で決まる
    // ------------------------------------------------------------
    const robocodeTheme = Blockly.Theme.defineTheme('robocode', {
      base: Blockly.Themes.Classic,
      componentStyles: {
        workspaceBackgroundColour: '#f4f7fb',  // 作業エリアの背景
        toolboxBackgroundColour: '#2c3e50',    // ツールボックスの背景（上のバーと同じ色）
        toolboxForegroundColour: '#ffffff',    // ツールボックスの文字
        flyoutBackgroundColour: '#3d566e',     // ブロック一覧が出てくる部分の背景
        flyoutForegroundColour: '#ffffff',     // ブロック一覧の文字
        flyoutOpacity: 0.95,                   // ブロック一覧の透け具合（1 で透けない）
        scrollbarColour: '#9aa8b6',            // スクロールバーの色
        insertionMarkerColour: '#000000',      // ブロックをくっつける場所の目印の色
        insertionMarkerOpacity: 0.3
      },
      fontStyle: {
        family: 'Meiryo, sans-serif',
        size: 12
      }
    });

    // ------------------------------------------------------------
    // Blockly を表示する
    //   ブロックは C++（ROBOCODE_BLOCKS で書いたもの）から届くので、ここでは書かない。
    // ------------------------------------------------------------
    const workspace = Blockly.inject('blocklyDiv', {
      toolbox: { kind: 'categoryToolbox', contents: [] },
      theme: robocodeTheme,
      trashcan: true,                     // 右下にゴミ箱を出す

      // 方眼を表示して、ブロックを方眼にそろえる
      grid: {
        spacing: 25,                      // 方眼の間隔
        length: 3,                        // 方眼の点の大きさ
        colour: '#cfd8e3',                // 方眼の色
        snap: true                        // ブロックを方眼にぴったりそろえる
      },

      // 拡大・縮小
      zoom: {
        controls: true,                   // 右下に ＋ − ボタンを出す
        wheel: true,                      // マウスホイールで拡大・縮小
        startScale: 1.1,                  // 最初の大きさ（1 が標準）
        maxScale: 2,                      // 一番大きくしたとき
        minScale: 0.5,                    // 一番小さくしたとき
        scaleSpeed: 1.2                   // 1回の拡大・縮小の幅
      },

      // スクロール
      move: {
        scrollbars: true,                 // スクロールバーを出す
        drag: true,                       // 何もないところをドラッグして動かせる
        wheel: false                      // ホイールは拡大・縮小に使うので、スクロールには使わない
      }
    });

    // ------------------------------------------------------------
    // 「Java を作る」ボタン：ブロックのデータを C++ に送る
    //   送る形：{ kind: "convert", name: "MyRobot", workspace: {...} }
    // ------------------------------------------------------------
    document.getElementById('convertButton').addEventListener('click', () => {
      if (!checkNames()) return;

      showStatus('', 'Java を作っています…');
      document.getElementById('convertButton').disabled = true;

      window.chrome.webview.postMessage({
        kind: 'convert',
        name: robotName(),
        package: packageName(),
        workspace: Blockly.serialization.workspaces.save(workspace)
      });
    });

    // ------------------------------------------------------------
    // パッケージ名とロボットの名前
    //   Robocode では「パッケージ名.ロボットの名前」（例：student.MyRobot）で表示される
    // ------------------------------------------------------------
    const robotName = () => document.getElementById('robotName').value.trim();
    const packageName = () => document.getElementById('packageName').value.trim();

    // パッケージ名：小文字の英字で始まり、小文字・数字・_ だけ。. で区切れる。16文字まで
    const PACKAGE_RULE = /^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)*$/;
    // ロボットの名前：英字で始まり、英字・数字・_ だけ。32文字まで
    const ROBOT_RULE = /^[A-Za-z][A-Za-z0-9_]*$/;

    // 名前が正しいか確かめる（だめなら理由を表示して false）
    function checkNames() {
      const pkg = packageName();
      const name = robotName();
      let error = '';
      if (!PACKAGE_RULE.test(pkg) || pkg.length > 16) {
        error = 'パッケージ名は、小文字の英字で始めて、小文字・数字・_ だけで書いてください（. で区切れます。16文字まで）';
      } else if (!ROBOT_RULE.test(name) || name.length > 32) {
        error = 'ロボットの名前は、英字で始めて、英字・数字・_ だけで書いてください（32文字まで）';
      }
      if (error) showStatus('error', error);
      return !error;
    }

    // 入力中に、使えない名前なら枠を赤くする
    function markInvalid() {
      const pkg = document.getElementById('packageName');
      const name = document.getElementById('robotName');
      pkg.classList.toggle('invalid', !PACKAGE_RULE.test(pkg.value.trim()));
      name.classList.toggle('invalid', !ROBOT_RULE.test(name.value.trim()));
    }
    ['packageName', 'robotName'].forEach(id => {
      document.getElementById(id).addEventListener('input', () => {
        markInvalid();
        changed = true;
        updateFileName();
      });
    });

    // ------------------------------------------------------------
    // 作品の保存・読み込み
    // ------------------------------------------------------------
    let currentPath = '';    // 今開いている作品ファイルの場所（まだ保存していなければ ''）
    let changed = false;     // 保存してから変更があったか
    let loading = false;     // 作品を読み込んでいる最中か（そのあいだの変更は数えない）

    // ブロックが変わったら「変更あり」にする
    workspace.addChangeListener((e) => {
      if (e.isUiEvent) return;
      if (!loading && !changed) {
        changed = true;
        updateFileName();
      }
      autosave();
    });

    // 上のバーにファイル名を表示する（変更があれば ＊ を付ける）
    function updateFileName() {
      const label = document.getElementById('fileName');
      const file = currentPath ? currentPath.split(/[\\/]/).pop() : '（まだ保存していません）';
      label.textContent = (changed ? '＊ ' : '') + file;
      label.title = currentPath;
      autosave();
    }

    // ------------------------------------------------------------
    // 自動保存：アプリを閉じても、次に開いたときに前回の続きから始められるようにする
    //   ブロックや名前が変わるたびに、少し待ってからパソコンの中（WebView2 の保存場所）に記録する。
    //   「保存」ボタンで作る作品ファイルとは別のもの。
    // ------------------------------------------------------------
    const AUTOSAVE_KEY = 'robocodeBlocks.autosave';
    let autosaveTimer = null;
    let restored = false;   // 前回の続きを読み込んだか（ページを開いて最初の1回だけ読み込む）

    function autosave() {
      if (!restored) return;   // 読み込む前に保存すると、前回の続きを消してしまうので待つ
      clearTimeout(autosaveTimer);
      autosaveTimer = setTimeout(() => {
        try {
          localStorage.setItem(AUTOSAVE_KEY, JSON.stringify({
            workspace: Blockly.serialization.workspaces.save(workspace),
            name: robotName(),
            package: packageName(),
            path: currentPath,
            changed: changed
          }));
        } catch (err) {
          // 保存できなくても、アプリはそのまま使えるようにする
        }
      }, 300);
    }

    // 前回の続きを読み込む（ブロックの定義が C++ から届いたあとに呼ぶ）
    function restoreAutosave() {
      if (restored) return;
      restored = true;

      let data = null;
      try {
        data = JSON.parse(localStorage.getItem(AUTOSAVE_KEY) || 'null');
      } catch (err) {
        data = null;
      }
      if (!data || !data.workspace) return;

      try {
        loading = true;
        Blockly.serialization.workspaces.load(data.workspace, workspace);
        workspace.clearUndo();
      } catch (err) {
        // 今のアプリにないブロックが入っていると、ここに来る
        loading = false;
        workspace.clear();
        showStatus('error', '前回の続きを開けませんでした（今のアプリにないブロックが入っていた可能性があります）');
        return;
      }

      if (data.name) document.getElementById('robotName').value = data.name;
      if (data.package) document.getElementById('packageName').value = data.package;
      currentPath = data.path || '';
      const wasChanged = !!data.changed;
      changed = wasChanged;
      markInvalid();
      updateFileName();
      // Blockly の変更のお知らせが終わってから、「変更あり／なし」を前回のとおりに戻す
      setTimeout(() => {
        changed = wasChanged;
        loading = false;
        updateFileName();
      }, 0);
      showStatus('ok', '前回の続きから始めます');
    }

    // 「変更なし」にする
    //   Blockly は少しあとで変更のお知らせを出すので、そのお知らせが終わってからもう一度「変更なし」にする
    function markUnchanged() {
      changed = false;
      updateFileName();
      setTimeout(() => {
        changed = false;
        loading = false;
        updateFileName();
      }, 0);
    }

    // 変更を捨ててもいいか聞く（変更がなければそのまま true）
    function confirmDiscard() {
      return !changed || confirm('保存していない変更があります。保存せずに続けますか？');
    }

    // 保存（saveAs が true なら必ず「名前を付けて保存」の画面を出す）
    function saveWork(saveAs) {
      window.chrome.webview.postMessage({
        kind: 'save',
        path: saveAs ? '' : currentPath,
        name: robotName(),
        package: packageName(),
        workspace: Blockly.serialization.workspaces.save(workspace)
      });
    }

    document.getElementById('saveButton').addEventListener('click', () => saveWork(false));
    document.getElementById('saveAsButton').addEventListener('click', () => saveWork(true));

    document.getElementById('openButton').addEventListener('click', () => {
      if (!confirmDiscard()) return;
      window.chrome.webview.postMessage({ kind: 'open' });
    });

    document.getElementById('newButton').addEventListener('click', () => {
      if (!confirmDiscard()) return;
      loading = true;
      workspace.clear();
      workspace.clearUndo();
      document.getElementById('robotName').value = 'MyRobot';
      currentPath = '';
      markInvalid();
      markUnchanged();
      document.getElementById('javaCode').textContent = '';
      document.getElementById('messages').innerHTML = '';
      showStatus('', '新しい作品です');
    });

    // Ctrl+S で保存
    document.addEventListener('keydown', (e) => {
      if (e.ctrlKey && (e.key === 's' || e.key === 'S')) {
        e.preventDefault();
        saveWork(false);
      }
    });

    // 開いた作品をブロックの画面に読み込む
    function loadWork(work, path) {
      try {
        loading = true;
        Blockly.serialization.workspaces.load(work.workspace || {}, workspace);
      } catch (err) {
        // 今のアプリにないブロックが入っていると、ここに来る
        loading = false;
        workspace.clear();
        showStatus('error', 'この作品は開けませんでした。今のアプリにないブロックが使われている可能性があります');
        addMessage('detail', '', String(err && err.message ? err.message : err));
        return;
      }
      workspace.clearUndo();
      if (work.robotName) document.getElementById('robotName').value = work.robotName;
      if (work.package) document.getElementById('packageName').value = work.package;
      currentPath = path;
      markInvalid();
      markUnchanged();
      document.getElementById('javaCode').textContent = '';
      document.getElementById('messages').innerHTML = '';
      showStatus('ok', '作品を開きました');
    }

    // 「Robocode の場所」ボタン：Robocode のフォルダを選び直す
    document.getElementById('folderButton').addEventListener('click', () => {
      window.chrome.webview.postMessage({ kind: 'chooseFolder' });
    });

    // 「Robocode を開く」ボタン：Robocode を起動する（開いていたら開き直す）
    document.getElementById('launchButton').addEventListener('click', () => {
      showStatus('', 'Robocode を起動しています…');
      window.chrome.webview.postMessage({ kind: 'launchRobocode' });
    });

    // できた Java をコピーする
    document.getElementById('copyButton').addEventListener('click', () => {
      const text = document.getElementById('javaCode').textContent;
      if (text) navigator.clipboard.writeText(text);
    });

    // ------------------------------------------------------------
    // C++ からのメッセージを受け取る
    // ------------------------------------------------------------
    window.chrome.webview.addEventListener('message', (event) => {
      const msg = event.data;

      // ブロックの定義とツールボックス
      if (msg.kind === 'blocks') {
        Blockly.defineBlocksWithJsonArray(msg.setup.blocks);
        workspace.updateToolbox(msg.setup.toolbox);

        // 検索できるように、ブロックの一覧を覚えておく
        buildSearchIndex(msg.setup);

        // 前回の続きを読み込む（ブロックの定義がそろってからでないと読み込めない）
        restoreAutosave();

        // ブロックの書き方にミスがあったら知らせる（作っている人向け）
        const problems = msg.setup.problems || [];
        if (problems.length > 0) {
          alert('ブロックの設定ミスがあります\n\n' + problems.join('\n'));
        }
      }

      // Java に変換・保存・コンパイルした結果
      if (msg.kind === 'java') {
        document.getElementById('convertButton').disabled = false;
        document.getElementById('javaCode').textContent = msg.java;
        showMessages(msg.errors, msg.warnings);

        if (!msg.ok) {
          showStatus('error', 'エラーが ' + msg.errors.length + ' 件あります。直してからもう一度押してください');
          return;
        }

        const build = msg.build;
        if (build && build.ok) {
          showStatus('ok', build.message + (msg.warnings.length > 0
            ? '（注意が ' + msg.warnings.length + ' 件あります）' : ''));
          addMessage('info', '✔', '保存した場所：' + build.javaPath);
          addMessage('info', '💡', 'Robocode を開いていたら、「Robocode を開く」で開き直すと一覧に出ます');
        } else if (build) {
          showStatus('error', build.message);
        }
        if (build && build.detail) {
          addMessage('detail', '', build.detail);
        }
      }

      // アプリの中で予想していない問題が起きた
      if (msg.kind === 'error') {
        document.getElementById('convertButton').disabled = false;
        showStatus('error', msg.message);
      }

      // 保存した結果
      if (msg.kind === 'saved') {
        if (msg.ok) {
          currentPath = msg.path;
          changed = false;
          updateFileName();
          showStatus('ok', '保存しました');
        } else if (!msg.canceled) {
          showStatus('error', msg.error);
        }
      }

      // 開いた結果
      if (msg.kind === 'opened') {
        if (msg.ok) {
          loadWork(msg.work, msg.path);
        } else if (!msg.canceled) {
          showStatus('error', msg.error);
        }
      }

      // Robocode を起動した結果
      if (msg.kind === 'launched') {
        showStatus(msg.ok ? 'ok' : 'error', msg.message);
      }

      // Robocode のフォルダを選び直した結果
      if (msg.kind === 'folder') {
        if (msg.path) {
          showStatus('ok', 'Robocode のフォルダ：' + msg.path);
        }
      }
    });

    // ------------------------------------------------------------
    // ブロックの検索
    //   上のバーの検索欄に文字を入れると、名前・説明・カテゴリに当てはまるブロックを一覧で出す。
    //   出てきたブロックは、ツールボックスのときと同じようにドラッグして使える。
    // ------------------------------------------------------------
    let searchIndex = [];   // { item: ツールボックスのブロック, words: 探すときに使う文字 }

    function buildSearchIndex(setup) {
      const texts = {};
      (setup.blocks || []).forEach(b => {
        // 「前に %1 進む」→「前に 進む」のように、%1 などを消して探しやすくする
        const message = String(b.message0 || '').replace(/%\d+/g, ' ');
        texts[b.type] = message + ' ' + (b.tooltip || '') + ' ' + b.type;
      });
      searchIndex = [];
      const walk = (contents, categoryName) => {
        (contents || []).forEach(item => {
          if (item.kind === 'category') {
            walk(item.contents, categoryName + ' ' + item.name);
          } else if (item.kind === 'block') {
            searchIndex.push({ item: item, words: ((texts[item.type] || '') + ' ' + categoryName).toLowerCase() });
          }
        });
      };
      walk(setup.toolbox && setup.toolbox.contents, '');
    }

    function searchBlocks(query) {
      const flyout = workspace.getToolbox() && workspace.getToolbox().getFlyout();
      if (!flyout) return;
      const words = query.trim().toLowerCase().split(/\s+/).filter(w => w);
      if (words.length === 0) {
        flyout.hide();
        return;
      }
      // スペースで区切ったら、全部の言葉に当てはまるものだけ出す
      const hits = searchIndex.filter(entry => words.every(w => entry.words.includes(w)));
      workspace.getToolbox().clearSelection();
      if (hits.length === 0) {
        flyout.show([{ kind: 'label', text: '「' + query.trim() + '」のブロックは見つかりませんでした' }]);
      } else {
        flyout.show(hits.map(entry => entry.item));
      }
    }

    const searchBox = document.getElementById('searchBox');
    let searchTimer = null;
    searchBox.addEventListener('input', () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => searchBlocks(searchBox.value), 150);
    });
    searchBox.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        searchBox.value = '';
        searchBlocks('');
      }
    });

    // ------------------------------------------------------------
    // 囲んで消す
    //   Shift を押しながら、作業エリアの何もないところからドラッグすると四角が出る。
    //   四角の中にすっぽり入ったブロックが選ばれるので、Delete キー（または Backspace）でまとめて消せる。
    // ------------------------------------------------------------
    const boxSelected = new Set();   // 囲んで選んだブロック
    let band = null;                 // ドラッグ中の四角 { x, y, div }

    function clearBoxSelection() {
      boxSelected.forEach(block => {
        if (!block.isDeadOrDying()) block.removeSelect();
      });
      boxSelected.clear();
    }

    function updateBand(e) {
      const left = Math.min(band.x, e.clientX);
      const top = Math.min(band.y, e.clientY);
      band.div.style.left = left + 'px';
      band.div.style.top = top + 'px';
      band.div.style.width = Math.abs(e.clientX - band.x) + 'px';
      band.div.style.height = Math.abs(e.clientY - band.y) + 'px';
    }

    const blocklyArea = document.getElementById('blocklyDiv');
    blocklyArea.addEventListener('pointerdown', (e) => {
      if (!e.shiftKey || e.button !== 0) {
        if (!e.shiftKey) clearBoxSelection();
        return;
      }
      // ツールボックスやブロック一覧の上では使わない
      if (e.target.closest && e.target.closest('.blocklyToolboxDiv, .blocklyToolbox, .blocklyFlyout')) return;

      // Blockly にドラッグ（ブロックの移動や画面のスクロール）をさせない
      e.preventDefault();
      e.stopPropagation();
      clearBoxSelection();

      const div = document.createElement('div');
      div.id = 'selectBand';
      document.body.appendChild(div);
      band = { x: e.clientX, y: e.clientY, div: div };
      updateBand(e);
    }, true);   // true：Blockly より先に受け取る

    document.addEventListener('pointermove', (e) => {
      if (band) updateBand(e);
    });

    document.addEventListener('pointerup', (e) => {
      if (!band) return;
      const x1 = Math.min(band.x, e.clientX), x2 = Math.max(band.x, e.clientX);
      const y1 = Math.min(band.y, e.clientY), y2 = Math.max(band.y, e.clientY);
      band.div.remove();
      band = null;
      if (x2 - x1 < 5 && y2 - y1 < 5) return;   // ほとんど動かしていなければ何もしない

      // 画面の座標を、作業エリアの座標に変える
      const topLeft = Blockly.utils.svgMath.screenToWsCoordinates(workspace, new Blockly.utils.Coordinate(x1, y1));
      const bottomRight = Blockly.utils.svgMath.screenToWsCoordinates(workspace, new Blockly.utils.Coordinate(x2, y2));

      workspace.getAllBlocks(false).forEach(block => {
        if (block.isShadow() || !block.isDeletable()) return;
        const r = block.getBoundingRectangleWithoutChildren();
        if (r.left >= topLeft.x && r.right <= bottomRight.x && r.top >= topLeft.y && r.bottom <= bottomRight.y) {
          boxSelected.add(block);
          block.addSelect();
        }
      });

      if (boxSelected.size > 0) {
        showStatus('', boxSelected.size + ' 個のブロックを選びました。Delete キーでまとめて消せます');
      }
    });

    // 選んだブロックをまとめて消す
    function deleteBoxSelection() {
      // 中や下につながっているブロックから先に消す（親から消すと、子も一緒に消えて二重に消してしまうため）
      const depth = (block) => {
        let d = 0;
        for (let p = block.getParent(); p; p = p.getParent()) d++;
        return d;
      };
      const blocks = Array.from(boxSelected).sort((a, b) => depth(b) - depth(a));
      const count = blocks.length;
      boxSelected.clear();

      Blockly.Events.setGroup(true);   // 「元に戻す（Ctrl+Z）」1回で全部戻せるようにする
      try {
        blocks.forEach(block => {
          if (!block.isDeadOrDying()) block.dispose(true, true);   // true：選ばなかった下のブロックは上につめる
        });
      } finally {
        Blockly.Events.setGroup(false);
      }
      showStatus('', count + ' 個のブロックを消しました（Ctrl+Z で元に戻せます）');
    }

    document.addEventListener('keydown', (e) => {
      if (boxSelected.size === 0) return;
      if (e.key !== 'Delete' && e.key !== 'Backspace') return;
      const tag = (document.activeElement && document.activeElement.tagName) || '';
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;   // 入力欄で文字を消しているときは何もしない
      e.preventDefault();
      e.stopPropagation();
      deleteBoxSelection();
    }, true);

    // ------------------------------------------------------------
    // Ctrl + D で複製
    //   ・ブロックを1つクリックして選んでいるとき：そのブロック（中に入っているブロックも）を複製
    //   ・Shift で囲んで選んでいるとき：選んだブロックをまとめて複製
    //   複製したブロックは、もとの少し右下に置かれる
    // ------------------------------------------------------------
    // 同じブロックを続けて複製したときに、同じ場所に重ならないよう少しずつずらすための記録
    let dupSourceKey = '';   // 前に複製したもとのブロック
    let dupCount = 0;        // 同じブロックを続けて何回複製したか

    function duplicateBlocks() {
      const useBox = boxSelected.size > 0;
      let roots;
      if (useBox) {
        // 親も選ばれているブロックは、親を複製すれば一緒に入るので、親のほうだけ複製する
        roots = Array.from(boxSelected).filter(b =>
          !b.isDeadOrDying() && !(b.getParent() && boxSelected.has(b.getParent())));
      } else {
        const selected = Blockly.common.getSelected();
        roots = (selected && selected.workspace === workspace && !selected.isShadow()) ? [selected] : [];
      }
      if (roots.length === 0) {
        showStatus('', '複製したいブロックをクリックして選んでから Ctrl + D を押してください');
        return;
      }

      // 同じブロックを続けて複製したら、そのたびに 30 ずつ右下にずらす
      const key = roots.map(b => b.id).join(',');
      dupCount = (key === dupSourceKey) ? dupCount + 1 : 1;
      dupSourceKey = key;
      const offset = 30 * dupCount;

      const created = [];
      Blockly.Events.setGroup(true);   // 「元に戻す（Ctrl+Z）」1回で全部戻せるようにする
      try {
        roots.forEach(block => {
          const state = Blockly.serialization.blocks.save(block, {
            addCoordinates: true,
            addNextBlocks: useBox,   // 囲んだときは、下につながっているブロックも（選んだものだけ）複製する
            saveIds: false           // 新しいブロックとして作る
          });
          if (useBox) {
            // 下につながっているブロックは、選んだものが続いているところまでにする
            let s = state, b = block;
            while (s.next && s.next.block) {
              const next = b.getNextBlock();
              if (!next || !boxSelected.has(next)) { delete s.next; break; }
              s = s.next.block;
              b = next;
            }
          }
          state.x = (state.x || 0) + offset;
          state.y = (state.y || 0) + offset;
          created.push(Blockly.serialization.blocks.append(state, workspace));
        });
      } finally {
        Blockly.Events.setGroup(false);
      }

      // 複製したブロックを選んだ状態にする（そのままドラッグしたり、Delete で消したりできる）
      clearBoxSelection();
      if (created.length === 1) {
        created[0].select();
      } else {
        created.forEach(b => { boxSelected.add(b); b.addSelect(); });
      }
      showStatus('', created.length + ' 個複製しました（Ctrl+Z で元に戻せます）');
    }

    document.addEventListener('keydown', (e) => {
      if (!e.ctrlKey || (e.key !== 'd' && e.key !== 'D')) return;
      const tag = (document.activeElement && document.activeElement.tagName) || '';
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;   // 入力欄で文字を打っているときは何もしない
      e.preventDefault();
      e.stopPropagation();
      duplicateBlocks();
    }, true);

    // 上の帯に結果を表示する
    function showStatus(type, text) {
      const status = document.getElementById('status');
      status.className = type;
      status.textContent = text;
    }

    // エラー・注意の一覧を表示する（クリックするとそのブロックに移動する）
    function showMessages(errors, warnings) {
      const box = document.getElementById('messages');
      box.innerHTML = '';
      const add = (type, mark, m) => {
        const div = document.createElement('div');
        div.className = 'message ' + type;
        div.textContent = mark + ' ' + (m.label ? '【' + m.label + '】' : '') + m.text;
        if (m.blockId && workspace.getBlockById(m.blockId)) {
          div.classList.add('clickable');
          div.title = 'クリックするとブロックに移動します';
          div.addEventListener('click', () => {
            workspace.centerOnBlock(m.blockId);
            workspace.getBlockById(m.blockId).select();
          });
        }
        box.appendChild(div);
      };
      errors.forEach(m => add('error', '✖', m));
      warnings.forEach(m => add('warning', '⚠', m));
    }

    // 一覧に1行足す（保存した場所や javac のエラーなど）
    function addMessage(type, mark, text) {
      const div = document.createElement('div');
      div.className = 'message ' + type;
      div.textContent = (mark ? mark + ' ' : '') + text;
      document.getElementById('messages').appendChild(div);
    }
  </script>
</body>
</html>
