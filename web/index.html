<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Robocode Blocks</title>

  <!-- いまは確認用にネットから Blockly を読み込む（あとで web フォルダに同梱する） -->
  <script src="https://unpkg.com/blockly/blockly.min.js"></script>
  <script src="https://unpkg.com/blockly/msg/ja.js"></script>

  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      font-family: "Meiryo", sans-serif;
    }
    #blocklyDiv {
      position: absolute;
      inset: 0;
    }
  </style>
</head>
<body>
  <div id="blocklyDiv"></div>

  <script>
    // ---- 表示確認用のブロック（あとで blocks/*.json に分ける） ----
    Blockly.defineBlocksWithJsonArray([
      {
        type: "rc_on_scanned",
        message0: "敵を見つけたとき %1",
        args0: [{ type: "input_statement", name: "DO" }],
        colour: 30,
        tooltip: "レーダーで敵を見つけたときに動きます"
      },
      {
        type: "rc_ahead",
        message0: "%1 歩前進",
        args0: [{ type: "field_number", name: "DIST", value: 100, min: 0 }],
        previousStatement: null,
        nextStatement: null,
        colour: 210
      },
      {
        type: "rc_turn",
        message0: "%1 に %2 度まわる",
        args0: [
          { type: "field_dropdown", name: "DIR", options: [["右", "RIGHT"], ["左", "LEFT"]] },
          { type: "field_number", name: "ANGLE", value: 90, min: 0, max: 360 }
        ],
        previousStatement: null,
        nextStatement: null,
        colour: 210
      },
      {
        type: "rc_fire",
        message0: "パワー %1 で撃つ",
        args0: [{ type: "field_number", name: "POWER", value: 1, min: 0.1, max: 3 }],
        previousStatement: null,
        nextStatement: null,
        colour: 0
      }
    ]);

    const toolbox = {
      kind: "categoryToolbox",
      contents: [
        { kind: "category", name: "イベント", colour: 30, contents: [
          { kind: "block", type: "rc_on_scanned" }
        ]},
        { kind: "category", name: "うごき", colour: 210, contents: [
          { kind: "block", type: "rc_ahead" },
          { kind: "block", type: "rc_turn" }
        ]},
        { kind: "category", name: "こうげき", colour: 0, contents: [
          { kind: "block", type: "rc_fire" }
        ]}
      ]
    };

    const workspace = Blockly.inject("blocklyDiv", {
      toolbox: toolbox,
      trashcan: true,
      zoom: { controls: true, wheel: true }
    });
  </script>
</body>
</html>
